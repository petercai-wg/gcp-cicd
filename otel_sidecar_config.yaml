apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-sidecar-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:      
      batch:
        timeout: 5s
        send_batch_size: 512 

    exporters:
      googlecloud:
        project: {GOOGLE_CLOUD_PROJECT}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [googlecloud]
          
      telemetry:
        logs:
          output_paths: [stdout]              