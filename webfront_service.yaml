apiVersion: v1
kind: Service
metadata:
  name: web-front-service
  annotations:
    cloud.google.com/backend-config: '{"default": "health-backendconfig"}'    
spec:
  type: NodePort # GKE Ingress requires NodePort or ClusterIP with NEGs
  selector:
    app: webfront # Links to the Deployment's pods
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080    
    nodePort: 30309