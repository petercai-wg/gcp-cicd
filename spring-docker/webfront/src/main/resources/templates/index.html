<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Welcome to Docker Java ShopWeb</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <div class="container-fluid">
        <div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
            <h1 class="page-header">Welcome to the Java GKE !</h1>
            <h2 class="sub-header text-center" th:text="|Product ${home}|"></h2>
            <div class="table-responsive">

                <table class="table table-striped" id="product-table">
                    <thead>
                        <tr>
                            <th>Product Num</th>
                            <th>SKU</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price $</th>
                            <th>Qty Available</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.id}">1</td>
                            <td th:text="${product.sku}">12345678</td>
                            <td th:text="${product.name}">Widget</td>
                            <td th:text="${product.description}">Widget</td>
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">1.19</td>
                            <td th:text="${product.amountAvailable}">2</td>
                            <td th:text="${product.location}">Location</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
