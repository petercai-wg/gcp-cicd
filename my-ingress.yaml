apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"  # Specifies the GKE Ingress controller    
    kubernetes.io/ingress.global-static-ip-name: "my-ingress-ip"  # Links the reserved static IP
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-front-service # Points to the Service name
            port:
              number: 8080
      - path: /host
        pathType: Prefix
        backend:
          service:
            name: stockmanager  # it requests stockmanager servoce with path /host 
            port:
              number: 8030